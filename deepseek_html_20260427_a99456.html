<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cybertruck Parking – Sonic City</title>
    <style>
        :root {
            --sonic-blue: #4488ff;
            --sonic-gold: #ffcc00;
            --sonic-green: #44dd66;
            --sonic-red: #ff3344;
            --sonic-dark: #1a1a2e;
            --sonic-white: #f0f0f0;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { overflow:hidden; background:#000; font-family:'Segoe UI',Arial,sans-serif; }
        canvas { display:block; }
        #hud {
            position:fixed; top:0; left:0; right:0; pointer-events:none; z-index:10;
            padding:12px 16px; display:flex; justify-content:space-between; align-items:flex-start;
            flex-wrap:wrap; gap:6px;
        }
        .hud-panel {
            background:rgba(26,26,46,0.8); border:2px solid var(--sonic-gold);
            border-radius:10px; padding:8px 14px; color:var(--sonic-white);
            backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
            box-shadow:0 4px 15px rgba(0,0,0,0.4); pointer-events:auto; min-width:80px;
        }
        .hud-panel h3 { font-size:8px; text-transform:uppercase; letter-spacing:2px; color:var(--sonic-gold); margin-bottom:2px; }
        .hud-panel .value { font-size:24px; font-weight:900; color:#fff; line-height:1; }
        .hud-panel .sub { font-size:9px; color:#aaa; }
        #score-panel { text-align:center; } #score-panel .value { color:var(--sonic-gold); font-size:32px; }
        #speed-panel .value { color:var(--sonic-blue); }
        #camera-panel .value { color:#fff; font-size:14px; }
        #message {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:20;
            pointer-events:none; text-align:center; transition:all 0.4s ease;
        }
        #message .big {
            font-size:40px; font-weight:900; color:var(--sonic-gold);
            text-shadow:0 0 30px rgba(255,204,0,0.7),0 0 60px rgba(255,204,0,0.4);
            letter-spacing:3px; opacity:0; transform:scale(0.5);
            transition:all 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        #message .big.show { opacity:1; transform:scale(1); }
        #message .hint { font-size:13px; color:#fff; margin-top:4px; opacity:0.8; letter-spacing:1px; }
        #instructions {
            position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
            z-index:10; pointer-events:none; display:flex; gap:5px; flex-wrap:wrap; justify-content:center;
        }
        .key-hint {
            background:rgba(26,26,46,0.75); border:1px solid rgba(255,255,255,0.25);
            border-radius:6px; padding:3px 6px; color:#ddd; font-size:9px;
            letter-spacing:1px; text-align:center; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
        }
        .key-hint span { display:inline-block; background:var(--sonic-blue); border-radius:3px; padding:1px 4px; margin:0 1px; font-weight:700; font-size:9px; color:#fff; }
        #minimap {
            position:fixed; bottom:70px; right:10px; width:100px; height:100px;
            border-radius:50%; border:2px solid var(--sonic-gold);
            background:rgba(26,26,46,0.7); z-index:10; pointer-events:none;
            overflow:hidden; box-shadow:0 0 15px rgba(255,204,0,0.3);
        }
        #minimap canvas { width:100%; height:100%; border-radius:50%; }
    </style>
</head>
<body>
<div id="hud">
    <div class="hud-panel" id="score-panel"><h3>⭐ Rings</h3><div class="value" id="score-value">0</div><div class="sub" id="spots-done">Spot 0/7</div></div>
    <div class="hud-panel" id="speed-panel"><h3>🚀 Speed</h3><div class="value" id="speed-value">0</div><div class="sub">MPH</div></div>

</div>
<div id="message"><div class="big" id="message-big">PERFECT PARK!</div><div class="hint" id="message-hint"></div></div>

<script>
(function(){
// ============ TEXTURES ============
function createCanvasTexture(w,h,draw){
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const ctx=c.getContext('2d');draw(ctx,w,h);
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
    t.magFilter=THREE.LinearFilter;t.minFilter=THREE.LinearMipmapLinearFilter;return t;
}
const grassTex=createCanvasTexture(256,256,(ctx,w,h)=>{
    ctx.fillStyle='#4a9e3a';ctx.fillRect(0,0,w,h);
    for(let i=0;i<800;i++){ctx.fillStyle=`rgba(${50+Math.random()*70},${140+Math.random()*60},${40+Math.random()*60},${0.3+Math.random()*0.4})`;ctx.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,1+Math.random()*4)}
});
const asphaltTex=createCanvasTexture(256,256,(ctx,w,h)=>{
    ctx.fillStyle='#3a3a40';ctx.fillRect(0,0,w,h);
    for(let i=0;i<800;i++){ctx.fillStyle=`rgba(${180+Math.random()*30},${180+Math.random()*30},${185+Math.random()*20},${0.2+Math.random()*0.3})`;ctx.fillRect(Math.random()*w,Math.random()*h,Math.random()*2,Math.random()*2)}
});
const checkTex=createCanvasTexture(128,128,(ctx,w,h)=>{
    const sq=w/8;for(let y=0;y<8;y++)for(let x=0;x<8;x++){ctx.fillStyle=(x+y)%2===0?'#ffffff':'#ff3344';ctx.fillRect(x*sq,y*sq,sq,sq)}
});
function createLicensePlateTex(){
    return createCanvasTexture(256,128,(ctx,w,h)=>{
        ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#000000';ctx.lineWidth=4;ctx.strokeRect(2,2,w-4,h-4);
        ctx.font='bold 32px Arial';ctx.fillStyle='#000000';ctx.textAlign='center';ctx.fillText('CYBERTRUCK',w/2,h/2+10);
    });
}

// ============ STATE ============
const gameState={score:0,totalSpots:7,spotsCompleted:0,activeSpotIndex:0,parkingTimer:0,parkingThreshold:1.5,spotTolerance:2.8,angleTolerance:0.4,messageTimeout:null,cameraMode:'back',gameComplete:false};
const input={forward:false,backward:false,left:false,right:false,handbrake:false,resetRequested:false};

let scene,camera,renderer,orbitControls,cybertruck,parkingLot,city,ambientLight,daylight,minimapCanvas,minimapCtx;

// ============ CITY (only roads + grass, no buildings) ============
class City{
    constructor(){
        this.mesh=new THREE.Object3D();
        const gGeo=new THREE.PlaneGeometry(400,400);
        const gMat=new THREE.MeshLambertMaterial({color:0x55bb44,map:grassTex});
        const g=new THREE.Mesh(gGeo,gMat);g.rotation.x=-Math.PI/2;g.position.y=-0.05;g.receiveShadow=true;this.mesh.add(g);
        const rMat=new THREE.MeshStandardMaterial({color:0x505050,map:asphaltTex,roughness:0.8,metalness:0.1});
        for(let z=-150;z<=150;z+=40){
            const r=new THREE.Mesh(new THREE.PlaneGeometry(8,400),rMat);r.rotation.x=-Math.PI/2;r.position.set(0,0.01,z);r.receiveShadow=true;this.mesh.add(r);
        }
        for(let x=-180;x<=180;x+=45){
            const r=new THREE.Mesh(new THREE.PlaneGeometry(400,8),rMat);r.rotation.x=-Math.PI/2;r.position.set(x,0.01,0);r.receiveShadow=true;this.mesh.add(r);
        }
    }
}

// ============ PARKING LOT (unchanged) ============

        const aGeo=new THREE.PlaneGeometry(70,90);
        const aMat=new THREE.MeshStandardMaterial({color:0x555555,map:asphaltTex,roughness:0.7});
        const a=new THREE.Mesh(aGeo,aMat);a.position.set(8,0.01,0);a.receiveShadow=true;this.mesh.add(a);
        const bMat=new THREE.MeshStandardMaterial({map:checkTex,emissive:0x331111,emissiveIntensity:0.2});
        const bt=new THREE.Mesh(new THREE.PlaneGeometry(70,1.5),bMat);bt.position.set(8,0.02,44.5);bt.receiveShadow=true;this.mesh.add(bt);
        const bb=bt.clone();bb.position.z=-44.5;this.mesh.add(bb);
        const bl=new THREE.Mesh(new THREE.PlaneGeometry(1.5,90),bMat);bl.position.set(-26.5,0.02,0);bl.receiveShadow=true;this.mesh.add(bl);
        const br=bl.clone();br.position.x=42.5;this.mesh.add(br);
        for(let z=-40;z<=40;z+=8){const d=new THREE.Mesh(new THREE.PlaneGeometry(0.4,4),new THREE.MeshBasicMaterial({color:0xffcc00}));d.position.set(8,0.02,z);this.mesh.add(d)}
        this.starMarkers=[];
        for(let i=0;i<14;i++){
            const s=new THREE.Mesh(new THREE.OctahedronGeometry(0.5),new THREE.MeshStandardMaterial({color:0xffcc00,emissive:0xffaa00,emissiveIntensity:0.8}));
            s.position.set(-24+Math.random()*64,1.5+Math.random()*2,-42+Math.random()*84);s.userData={collected:false,baseY:s.position.y,bobOffset:Math.random()*Math.PI*2};s.castShadow=true;this.mesh.add(s);this.starMarkers.push(s);
        }
        this.spotDefs=[
            {cx:8,cz:-30,angle:0,w:10,d:26},{cx:8,cz:0,angle:0,w:10,d:26},{cx:8,cz:25,angle:0,w:10,d:26},
            {cx:22,cz:-20,angle:Math.PI/2,w:10,d:26},{cx:-6,cz:10,angle:Math.PI,w:10,d:26},
            {cx:22,cz:10,angle:Math.PI/3,w:11,d:27},{cx:-6,cz:-10,angle:-Math.PI/4,w:11,d:27}
        ];
        this.spotRingGroups=[];this.spotDashedOutlines=[];
        this.spotDefs.forEach((def,idx)=>{
            const rg=new THREE.Object3D();
            rg.add(new THREE.Mesh(new THREE.TorusGeometry(3.5,0.4,16,32),new THREE.MeshStandardMaterial({color:0xffcc00,emissive:0xffcc00,emissiveIntensity:0.6})));
            rg.position.set(def.cx,2.5,def.cz);rg.rotation.y=def.angle;rg.visible=(idx===0);this.mesh.add(rg);this.spotRingGroups.push(rg);
            const og=new THREE.Object3D();const hw=def.w/2,hd=def.d/2;const dl=1.5,gl=1.0;
            const al=(len,axis,ox,oz)=>{
                const tot=Math.floor(len/(dl+gl));const st=-(tot*(dl+gl))/2+dl/2;
                for(let i=0;i<tot;i++){
                    const d=new THREE.Mesh(new THREE.PlaneGeometry(axis==='x'?dl:0.25,axis==='z'?dl:0.25),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.7}));
                    d.position.set(axis==='x'?st+i*(dl+gl):ox,0.03,axis==='z'?st+i*(dl+gl):oz);og.add(d);
                }
            };
            al(def.w,'x',0,hd);al(def.w,'x',0,-hd);al(def.d,'z',-hw,0);al(def.d,'z',hw,0);
            og.position.set(def.cx,0,def.cz);og.rotation.y=def.angle;og.visible=(idx===0);this.mesh.add(og);this.spotDashedOutlines.push(og);
        });
    }
    updateStars(t){this.starMarkers.forEach(s=>{if(!s.userData.collected){s.position.y=s.userData.baseY+Math.sin(t*2+s.userData.bobOffset)*0.6;s.rotation.y+=0.02;s.rotation.x+=0.015}})}
    checkStarCollection(cp){let c=0;this.starMarkers.forEach(s=>{if(!s.userData.collected&&cp.distanceTo(s.position)<3.5){s.userData.collected=true;s.visible=false;c++}});return c}
    setActiveSpot(i){this.spotRingGroups.forEach((g,idx)=>g.visible=(idx===i));this.spotDashedOutlines.forEach((g,idx)=>g.visible=(idx===i))}
}

// ============ CAMERA ============
function updateCamera(){
    if(gameState.cameraMode==='back'){
        const cp=cybertruck.getPosition();const fw=cybertruck.getForwardDirection();
        const bh=fw.clone().multiplyScalar(-38);const ds=cp.clone().add(bh).add(new THREE.Vector3(0,12,0));
        camera.position.lerp(ds,0.06);camera.lookAt(cp.x,cp.y+3,cp.z);if(orbitControls)orbitControls.enabled=false;
    }else if(gameState.cameraMode==='orbit'&&orbitControls){orbitControls.enabled=true}
    else if(gameState.cameraMode==='cockpit'){
        const dp=cybertruck.getDriverPosition();const fw=cybertruck.getForwardDirection();
        const la=dp.clone().add(fw.clone().multiplyScalar(10));camera.position.copy(dp);camera.lookAt(la);if(orbitControls)orbitControls.enabled=false;
    }else if(gameState.cameraMode==='top'){
        const cp=cybertruck.getPosition();camera.position.set(cp.x,cp.y+45,cp.z);camera.lookAt(cp.x,cp.y,cp.z);if(orbitControls)orbitControls.enabled=false;
    }
    if(orbitControls&&orbitControls.enabled)orbitControls.update();
}

// ============ PARKING EVAL ============
function evaluateParking(){
    const spot=parkingLot.spotDefs[gameState.activeSpotIndex];const cp=cybertruck.getPosition();
    const dist=Math.sqrt((cp.x-spot.cx)**2+(cp.z-spot.cz)**2);let ad=cybertruck.heading-spot.angle;
    while(ad>Math.PI)ad-=Math.PI*2;while(ad<-Math.PI)ad+=Math.PI*2;const aa=Math.abs(ad);
    const ca=Math.cos(-spot.angle),sa=Math.sin(-spot.angle);const lx=(cp.x-spot.cx)*ca-(cp.z-spot.cz)*sa;const lz=(cp.x-spot.cx)*sa+(cp.z-spot.cz)*ca;
    const wi=Math.abs(lx)<spot.w/2&&Math.abs(lz)<spot.d/2;const st=Math.abs(cybertruck.velocity)<0.05;
    if(wi&&st&&aa<gameState.angleTolerance&&dist<gameState.spotTolerance){
        const ac=Math.round((1-dist/gameState.spotTolerance)*50+(1-aa/gameState.angleTolerance)*50);gameState.score+=Math.max(10,ac);gameState.spotsCompleted++;gameState.activeSpotIndex++;
        if(gameState.activeSpotIndex>=gameState.totalSpots){gameState.gameComplete=true;gameState.score+=150;showMessage("🏆 ALL SPOTS PARKED! 🏆",`Final Score: ${gameState.score} Rings!`);parkingLot.setActiveSpot(-1)}
        else{parkingLot.setActiveSpot(gameState.activeSpotIndex);showMessage("PERFECT PARK! ⭐",`+${Math.max(10,ac)} rings!`)}
        updateHUD();
    }
}
function showMessage(b,h){const be=document.getElementById('message-big'),he=document.getElementById('message-hint');be.textContent=b;he.textContent=h;be.classList.add('show');if(gameState.messageTimeout)clearTimeout(gameState.messageTimeout);gameState.messageTimeout=setTimeout(()=>be.classList.remove('show'),2200)}

function updateHUD(){
    document.getElementById('score-value').textContent=gameState.score;document.getElementById('spots-done').textContent=`Spot ${gameState.spotsCompleted}/${gameState.totalSpots}`;
    document.getElementById('speed-value').textContent=Math.round(cybertruck.speed);
    const ge=document.getElementById('gear-value');if(Math.abs(cybertruck.velocity)<0.05){ge.textContent='P';ge.style.color='#ffcc00'}else if(cybertruck.velocity>0){ge.textContent='D';ge.style.color='#44ff44'}else{ge.textContent='R';ge.style.color='#ff4444'}
    document.getElementById('camera-mode').textContent=gameState.cameraMode.charAt(0).toUpperCase()+gameState.cameraMode.slice(1);
    const ap=document.getElementById('accuracy-panel');if(gameState.activeSpotIndex>=0&&gameState.activeSpotIndex<gameState.totalSpots&&!gameState.gameComplete){ap.style.display='block';document.getElementById('accuracy-value').textContent=`Spot ${gameState.activeSpotIndex+1}/${gameState.totalSpots}`}else if(gameState.gameComplete){ap.style.display='block';document.getElementById('accuracy-value').textContent='Done! 🏆'}else{ap.style.display='none'}
}
function updateMinimap(){
    if(!minimapCtx)return;const w=100,h=100,sc=0.7,cx=w/2,cy=h/2;minimapCtx.clearRect(0,0,w,h);minimapCtx.fillStyle='rgba(26,26,46,0.9)';minimapCtx.beginPath();minimapCtx.arc(cx,cy,w/2-2,0,Math.PI*2);minimapCtx.fill();minimapCtx.fillStyle='#3a3a40';minimapCtx.fillRect(cx-28*sc,cy-38*sc,56*sc,76*sc);
    parkingLot.spotDefs.forEach((spot,i)=>{
        minimapCtx.save();minimapCtx.translate(cx+(spot.cx-8)*sc,cy+spot.cz*sc);minimapCtx.rotate(spot.angle);
        if(i===gameState.activeSpotIndex&&!gameState.gameComplete){minimapCtx.fillStyle='rgba(255,204,0,0.6)';minimapCtx.strokeStyle='#ffcc00';minimapCtx.lineWidth=2}else if(i<gameState.spotsCompleted){minimapCtx.fillStyle='rgba(68,255,100,0.4)';minimapCtx.strokeStyle='#44ff44';minimapCtx.lineWidth=1}else{minimapCtx.fillStyle='rgba(255,255,255,0.2)';minimapCtx.strokeStyle='#888';minimapCtx.lineWidth=1}
        minimapCtx.fillRect(-spot.w/2*sc,-spot.d/2*sc,spot.w*sc,spot.d*sc);minimapCtx.strokeRect(-spot.w/2*sc,-spot.d/2*sc,spot.w*sc,spot.d*sc);minimapCtx.restore();
    });
    const cX=cx+(cybertruck.mesh.position.x-8)*sc,cY=cy+cybertruck.mesh.position.z*sc;minimapCtx.save();minimapCtx.translate(cX,cY);minimapCtx.rotate(cybertruck.heading);minimapCtx.fillStyle='#ff3344';minimapCtx.fillRect(-3,-6,6,12);minimapCtx.fillStyle='#fff';minimapCtx.fillRect(-1,-5,2,4);minimapCtx.restore();minimapCtx.fillStyle='#fff';minimapCtx.beginPath();minimapCtx.arc(cX,cY,3,0,Math.PI*2);minimapCtx.fill();
}
function gameLoop(){
    requestAnimationFrame(gameLoop);const dt=Math.min(clock.getDelta(),0.1);cybertruck.updatePhysics(dt);parkingLot.updateStars(performance.now()*0.001);
    const stars=parkingLot.checkStarCollection(cybertruck.getPosition());if(stars>0){gameState.score+=stars*5;updateHUD()}
    const si=gameState.activeSpotIndex;if(si>=0&&si<gameState.totalSpots&&!gameState.gameComplete){
        const spot=parkingLot.spotDefs[si];const cp=cybertruck.getPosition();const dist=Math.sqrt((cp.x-spot.cx)**2+(cp.z-spot.cz)**2);const st=Math.abs(cybertruck.velocity)<0.05;
        const ca=Math.cos(-spot.angle),sa=Math.sin(-spot.angle);const lx=(cp.x-spot.cx)*ca-(cp.z-spot.cz)*sa;const lz=(cp.x-spot.cx)*sa+(cp.z-spot.cz)*ca;const wi=Math.abs(lx)<spot.w/2&&Math.abs(lz)<spot.d/2;
        if(wi&&st&&dist<gameState.spotTolerance*2){gameState.parkingTimer+=dt;if(gameState.parkingTimer>gameState.parkingThreshold)evaluateParking()}else{gameState.parkingTimer=Math.max(0,gameState.parkingTimer-dt*2)}
    }
    if(input.resetRequested){input.resetRequested=false;const idx=gameState.activeSpotIndex;if(idx>=0&&idx<gameState.totalSpots&&!gameState.gameComplete){const s=parkingLot.spotDefs[idx];cybertruck.resetTo(new THREE.Vector3(s.cx+15,cybertruck.height/2,s.cz+5),s.angle+Math.PI)}else cybertruck.resetTo(new THREE.Vector3(8,cybertruck.height/2,-35),0);showMessage("Reset!","")}
    updateCamera();updateHUD();updateMinimap();renderer.render(scene,camera);
}

// ============ EVENTS ============
window.addEventListener('keydown',e=>{switch(e.key.toLowerCase()){case'w':case'arrowup':input.forward=true;break;case's':case'arrowdown':input.backward=true;break;case'a':case'arrowleft':input.left=true;break;case'd':case'arrowright':input.right=true;break;case' ':input.handbrake=true;e.preventDefault();break;case'1':gameState.cameraMode='back';break;case'2':gameState.cameraMode='orbit';break;case'3':gameState.cameraMode='cockpit';break;case'4':gameState.cameraMode='top';break;case'r':input.resetRequested=true;break}});
window.addEventListener('keyup',e=>{switch(e.key.toLowerCase()){case'w':case'arrowup':input.forward=false;break;case's':case'arrowdown':input.backward=false;break;case'a':case'arrowleft':input.left=false;break;case'd':case'arrowright':input.right=false;break;case' ':input.handbrake=false;break}});
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
init();
})();
</script>
